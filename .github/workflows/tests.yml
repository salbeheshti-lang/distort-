name: Tests — Config Parser + Xray Validation + Emergency Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }

      - name: Install deps
        run: bun install

      - name: Run config parser tests
        run: bun run src/lib/__tests__/config-parser.test.ts

      - name: Run xray config validation tests (JSON structure)
        run: bun run src/lib/__tests__/xray-config.test.ts

      - name: Run kill switch logic tests
        run: bun run src/lib/__tests__/kill-switch-logic.test.ts

      - name: Run Emergency Connectivity engine tests
        run: bun test src/lib/__tests__/emergency-connectivity.test.ts

      - name: Run SSRF guard tests
        run: |
          bun -e "
          const { isPrivateHost, isPrivateIp } = require('./src/lib/emergency-connectivity/ssrf-guard.ts');
          const tests = [
            { host: '127.0.0.1', expect: true },
            { host: '10.0.0.1', expect: true },
            { host: '192.168.1.1', expect: true },
            { host: '172.16.0.1', expect: true },
            { host: '169.254.169.254', expect: true },  // cloud metadata
            { host: 'localhost', expect: true },
            { host: '::1', expect: true },
            { host: '8.8.8.8', expect: false },
            { host: '1.1.1.1', expect: false },
            { host: 'example.com', expect: false },
          ];
          let pass = 0, fail = 0;
          for (const t of tests) {
            const got = isPrivateHost(t.host);
            if (got === t.expect) { pass++; console.log('✓', t.host, '→', got); }
            else { fail++; console.log('✗', t.host, '→', got, '(expected', t.expect, ')'); }
          }
          console.log('\n' + pass + ' pass / ' + fail + ' fail');
          if (fail > 0) process.exit(1);
          "

      - name: Run client-diagnostics state machine tests
        run: |
          bun -e "
          // Verify the 3-state probe result (ok/timeout/unknown) is correctly typed
          const mod = require('./src/lib/emergency-connectivity/client-diagnostics.ts');
          const fn = mod.quickHealthCheck || mod.diagnoseClientSide;
          if (typeof fn !== 'function') {
            console.error('✗ Expected a function export');
            process.exit(1);
          }
          console.log('✓ client-diagnostics exports expected functions');
          "

      - name: Download xray binary for validation
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          unzip -o /tmp/xray.zip -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          # Copy geoip.dat and geosite.dat next to xray binary
          cp /tmp/xray-bin/geoip.dat /tmp/ 2>/dev/null || true
          cp /tmp/xray-bin/geosite.dat /tmp/ 2>/dev/null || true
          echo "XRAY_BIN_PATH=/tmp/xray-bin/xray" >> $GITHUB_ENV

      - name: Run xray run -test validation (with real binary + geo data)
        run: bun run src/lib/__tests__/xray-config.test.ts
        env:
          XRAY_BIN_PATH: /tmp/xray-bin/xray

      # ─── Desktop (Electron) tests ────────────────────────────────────────────
      # These live in desktop/src/__tests__/ and import bun:test + node-fetch +
      # https-proxy-agent from desktop/node_modules. They MUST run with
      # working-directory: desktop so bun resolves the right deps.
      #
      # Without these steps CI reported success even when desktop tests were
      # broken — a false green. The most important regression tests here are:
      #   - verify-tunnel.test.ts        → verifies leak-detection logic
      #   - quick-connect-failover.test.ts → verifies tiered failover + stale guard
      #   - stop-and-companion-stale-guard.test.ts → verifies stopVpnEngine exit
      #     wait + companion API stale-guard counter sharing (v1.0.38 audit)
      #   - production-verify-tunnel.test.ts → exercises real node-fetch +
      #     https-proxy-agent against a mock proxy (closest to real Electron)
      - name: Install desktop deps
        working-directory: desktop
        run: bun install

      - name: Run desktop verifier tests
        working-directory: desktop
        run: bun test src/__tests__/verify-tunnel.test.ts

      - name: Run desktop failover tests
        working-directory: desktop
        run: bun test src/__tests__/quick-connect-failover.test.ts

      - name: Run desktop stale-guard tests
        working-directory: desktop
        run: bun test src/__tests__/stop-and-companion-stale-guard.test.ts

      - name: Run desktop production-verify tests
        working-directory: desktop
        run: bun test src/__tests__/production-verify-tunnel.test.ts

      - name: Run desktop stuck-deterministic tests
        working-directory: desktop
        run: bun test src/__tests__/stuck-deterministic.test.ts

      - name: Run desktop xray-process-manager tests
        working-directory: desktop
        run: bun test src/__tests__/xray-process-manager.test.ts

      # Regression tests for port-bind failure + deadlock fixes (PR #4).
      # Verifies:
      #   - checkPortInUse 3-state detection (free/in-use/unknown)
      #   - checkXrayPortsInUse both-ports check
      #   - stopXrayProcess already-exited detection
      #   - port release after stop (failover prerequisite)
      #   - concurrent startVpnEngine mutex
      #   - INTEGRATION: 6 failover scenarios with real child processes
      #   - Deadlock regression: stale verify + stale exit paths
      - name: Run desktop xray-port-bind-failure tests
        working-directory: desktop
        run: bun test src/__tests__/xray-port-bind-failure.test.ts

  # ─── Windows test job ────────────────────────────────────────────────────
  # Verifies the port-bind failure + deadlock fixes on Windows, where:
  #   - SIGTERM maps to TerminateProcess (no graceful signal delivery)
  #   - SIGKILL maps to TerminateProcess (same as SIGTERM)
  #   - Port release timing may differ (TIME_WAIT behavior)
  #   - ECONNREFUSED is returned the same way as Linux
  #
  # This job runs ONLY the xray-port-bind-failure tests (not the full
  # desktop suite) to keep CI fast and focused on the Windows-specific
  # behavior of the port-bind fix.
  #
  # setup-node is required because the test file uses spawn("node", [script])
  # to launch mock xray binaries. Without setup-node, "node" may not be in
  # PATH on the Windows runner.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - name: Install desktop deps
        working-directory: desktop
        run: bun install
      - name: Run desktop xray-port-bind-failure tests (Windows)
        working-directory: desktop
        run: bun test src/__tests__/xray-port-bind-failure.test.ts
