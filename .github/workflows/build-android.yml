name: Build DISTORT Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which APK to build (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options: ['debug', 'release']

# ─── Secrets required for signed release builds ──────────────────────────────
# Set these in the repo's Settings → Secrets and variables → Actions:
#
#   DISTORT_KEYSTORE_FILE_B64   — base64-encoded contents of the release keystore
#                                  file (we decode it in the workflow; avoids
#                                  needing to commit the binary .keystore).
#   DISTORT_KEYSTORE_PASSWORD   — keystore password
#   DISTORT_KEY_ALIAS           — alias of the release key entry
#   DISTORT_KEY_PASSWORD        — password for the release key entry
#
# BACKUP REQUIREMENT: keep the keystore file itself in a secure off-repo
# location (encrypted USB, password manager attachment, etc.). If the
# signing key is lost, in-app updates can no longer be installed — users
# would have to uninstall before installing a new build with a different
# key. There is no recovery path.
#
# If any of these secrets are missing, the release job falls back to the
# debug signing key. The resulting APK is still installable on a clean
# device, but cannot be installed over a previously-released production
# build (signature mismatch).

# softprops/action-gh-release@v2 requires write access to the repo's
# contents to create / edit the release. The default GITHUB_TOKEN has
# this only if explicitly granted.
permissions:
  contents: write

jobs:
  # ─── Debug build — runs on every push and on workflow_dispatch ────────────
  build-debug:
    name: Build debug APK
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Download xray-core for all Android ABIs
        working-directory: mobile/android/app/src/main/jniLibs
        shell: bash
        run: |
          # Pin to a specific version for reproducible builds.
          XRAY_VERSION="v26.3.27"

          # arm64-v8a (most modern phones — ~95% of devices)
          mkdir -p arm64-v8a
          curl -fsSL -o /tmp/xray-arm64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o /tmp/xray-arm64.zip -d /tmp/arm64-tmp
          cp /tmp/arm64-tmp/xray arm64-v8a/libxray.so
          chmod +x arm64-v8a/libxray.so
          rm -rf /tmp/arm64-tmp /tmp/xray-arm64.zip

          # amd64 (x86_64 emulators) — XTLS names it 'amd64' not 'x86_64'
          mkdir -p x86_64
          curl -fsSL -o /tmp/xray-amd64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-amd64.zip"
          unzip -o /tmp/xray-amd64.zip -d /tmp/amd64-tmp
          cp /tmp/amd64-tmp/xray x86_64/libxray.so
          chmod +x x86_64/libxray.so
          rm -rf /tmp/amd64-tmp /tmp/xray-amd64.zip

          echo "xray version: ${XRAY_VERSION}"
          echo "Bundled ABIs:"
          ls -lh */libxray.so
      - name: Install Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Generate Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.5
      - name: Read VERSION_CODE
        id: vc
        run: echo "version_code=$(cat VERSION_CODE)" >> $GITHUB_OUTPUT
      - name: Build debug APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ steps.vc.outputs.version_code }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK with version
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/DISTORT-Android-v1.0.${{ steps.vc.outputs.version_code }}-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DISTORT-Android-APK-debug
          path: |
            artifacts/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/**/*.apk

  # ─── Release build — only on tag push (v*) or explicit workflow_dispatch ──
  release:
    name: Build & publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')
    runs-on: ubuntu-latest
    # Release build doesn't strictly need the debug build to succeed, but
    # depends on it for PR feedback. Running both in parallel is faster.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Download xray-core for all Android ABIs
        working-directory: mobile/android/app/src/main/jniLibs
        shell: bash
        run: |
          XRAY_VERSION="v26.3.27"

          mkdir -p arm64-v8a
          curl -fsSL -o /tmp/xray-arm64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o /tmp/xray-arm64.zip -d /tmp/arm64-tmp
          cp /tmp/arm64-tmp/xray arm64-v8a/libxray.so
          chmod +x arm64-v8a/libxray.so
          rm -rf /tmp/arm64-tmp /tmp/xray-arm64.zip

          mkdir -p x86_64
          curl -fsSL -o /tmp/xray-amd64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-amd64.zip"
          unzip -o /tmp/xray-amd64.zip -d /tmp/amd64-tmp
          cp /tmp/amd64-tmp/xray x86_64/libxray.so
          chmod +x x86_64/libxray.so
          rm -rf /tmp/amd64-tmp /tmp/xray-amd64.zip

          echo "xray version: ${XRAY_VERSION}"
          echo "Bundled ABIs:"
          ls -lh */libxray.so
      - name: Install Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Generate Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.5
      - name: Read VERSION_CODE
        id: vc
        run: |
          VC=$(cat VERSION_CODE)
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          # Mark releases with version_code < 10 as prerelease (early
          # development phase). Change this rule once we ship a stable
          # production build.
          if [ "$VC" -lt 10 ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # ─── Decode release keystore (if all 4 secrets are present) ──────────
      # The keystore is stored base64-encoded in a GitHub secret. We decode
      # it to a temp file at build time — the binary never lands in the repo.
      - name: Decode release keystore
        id: keystore
        env:
          DISTORT_KEYSTORE_FILE_B64: ${{ secrets.DISTORT_KEYSTORE_FILE_B64 }}
          DISTORT_KEYSTORE_PASSWORD: ${{ secrets.DISTORT_KEYSTORE_PASSWORD }}
          DISTORT_KEY_ALIAS: ${{ secrets.DISTORT_KEY_ALIAS }}
          DISTORT_KEY_PASSWORD: ${{ secrets.DISTORT_KEY_PASSWORD }}
        run: |
          if [ -z "$DISTORT_KEYSTORE_FILE_B64" ] || [ -z "$DISTORT_KEYSTORE_PASSWORD" ] \
             || [ -z "$DISTORT_KEY_ALIAS" ] || [ -z "$DISTORT_KEY_PASSWORD" ]; then
            echo "keystore_present=false" >> $GITHUB_OUTPUT
            echo "::warning::Release keystore secrets missing — falling back to debug-signed release APK. The resulting APK cannot be installed over a previously-released production build."
          else
            echo "$DISTORT_KEYSTORE_FILE_B64" | base64 -d > /tmp/distort-release.keystore
            chmod 600 /tmp/distort-release.keystore
            echo "keystore_present=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded: $(ls -la /tmp/distort-release.keystore)"
          fi

      - name: Build release APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ steps.vc.outputs.version_code }}
          DISTORT_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_present == 'true' && '/tmp/distort-release.keystore' || '' }}
          DISTORT_KEYSTORE_PASSWORD: ${{ secrets.DISTORT_KEYSTORE_PASSWORD }}
          DISTORT_KEY_ALIAS: ${{ secrets.DISTORT_KEY_ALIAS }}
          DISTORT_KEY_PASSWORD: ${{ secrets.DISTORT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: apk
        run: |
          mkdir -p artifacts
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            exit 1
          fi
          NAME="DISTORT-Android-v1.0.${{ steps.vc.outputs.version_code }}.apk"
          cp "$APK" "artifacts/$NAME"
          echo "apk_name=$NAME" >> $GITHUB_OUTPUT
          echo "apk_path=artifacts/$NAME" >> $GITHUB_OUTPUT
          echo "Built: $(ls -lh artifacts/)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DISTORT-Android-APK-release
          path: |
            artifacts/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/**/*.apk

      # ─── Publish to GitHub Releases (only on tag push) ──────────────────
      # softprops/action-gh-release automatically picks up the tag that
      # triggered the workflow and attaches the APK asset to the release.
      # If the release doesn't exist yet, it creates one (draft by default).
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          # Use GitHub's auto-generated release notes (commits since last
          # tag) plus the release name in the v1.0.X format.
          name: DISTORT v1.0.${{ steps.vc.outputs.version_code }}
          # Don't mark as draft — the tag push should immediately publish.
          # Set to true if you want manual review before publishing.
          draft: false
          # Mark as a prerelease if VERSION_CODE < 10 (early development
          # phase). Computed in the `vc` step above to avoid relying on
          # implicit numeric coercion in ${{ }} expressions.
          prerelease: ${{ steps.vc.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
